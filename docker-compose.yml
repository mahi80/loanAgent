# Runs both prototypes locally:
#   docker compose up --build
#   A1 loan lifecycle  -> http://localhost:8501
#   A2 demand response -> http://localhost:8502
# LLM: set AZURE_OPENAI_*, OPENAI_API_KEY or OLLAMA_MODEL in .env (optional; mock mode otherwise).
x-app: &app
  build: .
  image: loanagent-fde:latest
  env_file:
    - path: .env
      required: false
  environment: &env
    OLLAMA_BASE_URL: http://host.docker.internal:11434/v1   # Ollama on the host / WSL
  extra_hosts:
    - "host.docker.internal:host-gateway"   # makes host.docker.internal work on Linux too
  volumes:
    - runtime:/app/runtime   # audit logs + mock SAP outbox survive restarts
  restart: unless-stopped

services:
  loan-lifecycle:
    <<: *app
    container_name: a1-loan-lifecycle
    environment:
      <<: *env
      APP: a1_loan_lifecycle
      PORT: "8501"
    ports:
      - "8501:8501"

  demand-response:
    <<: *app
    container_name: a2-demand-response
    environment:
      <<: *env
      APP: a2_chem_demand
      PORT: "8502"
    ports:
      - "8502:8502"

volumes:
  runtime:
